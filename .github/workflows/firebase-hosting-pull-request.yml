# .github/workflows/firebase-hosting-pull-request.yml

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- START OF FIX ---
      # 1. Install dependencies for Cloud Functions (if needed)
      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions 

      # 2. Deploy the app (Note: since we are not running 'npm run build' in the root, 
      #    the static hosting deployment will work for your current index.html)
      # --- END OF FIX ---
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KNOST_FINANCE_APP }}
          projectId: knost-finance-app